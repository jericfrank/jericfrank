<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Engineer (Remote)</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      .full-screen-container {
        height: 100vh;
        width: 100vw;
      }

      .full-screen-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="full-screen-container">
      <iframe
        class="full-screen-iframe"
        src="https://docs.google.com/document/d/1_qxg9X6YrdlUPEwGFf3B9tUGmlnjQge0MqV69F1yQ0U/preview"
        allowfullscreen
        title="Google Doc"
      ></iframe>
    </div>
  </body>
</html>
